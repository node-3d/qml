name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-15-intel
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-15
            node_arch: arm64
            archflags: '-arch arm64'

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install Modules
        run: npm ci

      - name: Build Current Binary
        run: npm run build:rebuild
        env:
          npm_config_arch: ${{ matrix.node_arch }}
          ARCHFLAGS: ${{ matrix.archflags }}

      - name: Stamp Linux Runtime Paths
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          bin="$(npm_config_arch='${{ matrix.node_arch }}' node --input-type=module -e "import { getBin } from '@node-3d/addon-tools'; process.stdout.write(getBin());")"
          rpath="\$ORIGIN:\$ORIGIN/../node_modules/@node-3d/deps-qt-core/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qt-gui/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qt-qml/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qmlui/$bin:\$ORIGIN/../../@node-3d/deps-qt-core/$bin:\$ORIGIN/../../@node-3d/deps-qt-gui/$bin:\$ORIGIN/../../@node-3d/deps-qt-qml/$bin:\$ORIGIN/../../@node-3d/deps-qmlui/$bin:\$ORIGIN/../../deps-qt-core/$bin:\$ORIGIN/../../deps-qt-gui/$bin:\$ORIGIN/../../deps-qt-qml/$bin:\$ORIGIN/../../deps-qmlui/$bin"
          patchelf --force-rpath --set-rpath "$rpath" "$bin/qml.node"
          readelf -d "$bin/qml.node" | grep -E 'RPATH|RUNPATH|NEEDED'
          readelf -d "$bin/qml.node" | grep -q 'deps-qt-core'

      - name: Verify Package Loads - Mac
        if: matrix.target == 'darwin-x64' || matrix.target == 'darwin-arm64'
        run: |
          node --input-type=module <<'JS'
          const qml = await import('./ts/index.ts');

          const required = [
            ['View', qml.View],
            ['Property', qml.Property],
            ['Method', qml.Method],
          ];

          for (const [name, value] of required) {
            if (typeof value !== 'function') {
              throw new TypeError(`${name} did not load as a function.`);
            }
          }
          JS

      - name: Run Unit Tests - Linux
        if: matrix.target == 'linux-x64' || matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libgles2-mesa-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -qq libdbus-1-3 libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
          if [ '${{ matrix.target }}' = 'linux-arm64' ]; then
            export QT_XCB_GL_INTEGRATION=xcb_egl
          fi
          QT_QPA_PLATFORM=xcb xvfb-run --auto-servernum npm run test:ci

      - uses: ssciwr/setup-mesa-dist-win@v3
        if: matrix.target == 'windows-x64'

      - name: Run Unit Tests - Windows
        if: matrix.target == 'windows-x64'
        run: npm run test:ci
