name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-15-intel
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-15
            node_arch: arm64
            archflags: '-arch arm64'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch
      - name: Install Modules
        run: npm ci
      - name: Build Current Binary
        run: npm run build:rebuild
        env:
          ARCHFLAGS: ${{ matrix.archflags }}
      - name: Stamp Linux Runtime Paths
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          bin="$(node --input-type=module -e "import { getBin } from '@node-3d/addon-tools'; process.stdout.write(getBin());")"
          rpath="\$ORIGIN:\$ORIGIN/../node_modules/@node-3d/deps-qt-core/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qt-gui/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qt-qml/$bin:\$ORIGIN/../node_modules/@node-3d/deps-qmlui/$bin:\$ORIGIN/../../@node-3d/deps-qt-core/$bin:\$ORIGIN/../../@node-3d/deps-qt-gui/$bin:\$ORIGIN/../../@node-3d/deps-qt-qml/$bin:\$ORIGIN/../../@node-3d/deps-qmlui/$bin:\$ORIGIN/../../deps-qt-core/$bin:\$ORIGIN/../../deps-qt-gui/$bin:\$ORIGIN/../../deps-qt-qml/$bin:\$ORIGIN/../../deps-qmlui/$bin"
          patchelf --force-rpath --set-rpath "$rpath" "$bin/qml.node"
          readelf -d "$bin/qml.node" | grep -E 'RPATH|RUNPATH|NEEDED'
          readelf -d "$bin/qml.node" | grep -q 'deps-qt-core'
      - name: Build TypeScript
        run: npm run build:ci
      - name: Verify Package Loads - macOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          node --input-type=module <<'JS'
          const qml = await import('./ts/index.ts');
          for (const name of ['View', 'Property', 'Method']) {
            if (typeof qml[name] !== 'function') {
              throw new TypeError(`${name} did not load as a function.`);
            }
          }
          JS
      - name: Run Unit Tests - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libgles2-mesa-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -qq libdbus-1-3 libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
          if [ '${{ matrix.target }}' = 'linux-arm64' ]; then
            export QT_XCB_GL_INTEGRATION=xcb_egl
          fi
          QT_QPA_PLATFORM=xcb xvfb-run --auto-servernum npm run test:ci
      - uses: ssciwr/setup-mesa-dist-win@v3
        if: matrix.target == 'windows-x64'
      - name: Run Unit Tests - Windows
        if: matrix.target == 'windows-x64'
        run: npm run test:ci
      - name: Verify macOS deployment target
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            versions="$(otool -l "$file" | awk '
              $1 == "cmd" {
                wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
              }
              wanted != "" && $1 == wanted { print $2; wanted = "" }
            ')"
            if [ -z "$versions" ] || printf '%s\n' "$versions" | grep -Evxq '13\.5(\.0)?'; then
              echo "Unexpected or missing macOS deployment target: $file" >&2
              printf '%s\n' "$versions" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(find bin-* -type f \( -name '*.node' -o -name '*.dylib' \) -print0)
          test "$checked" -gt 0
          echo "Verified $checked Mach-O files target macOS 13.5"
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, unit-tests]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Qt runtime dependencies - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libegl1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/qml'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test
